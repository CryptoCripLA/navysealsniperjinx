<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Pump.fun Market Lab</title>
  <desc id="desc">Solana meme market raw data, cost modeling, and AI assisted research cover image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#10251f"/>
      <stop offset="1" stop-color="#1e1638"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23d18b"/>
      <stop offset="0.55" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 488 C180 430 266 555 446 494 C626 433 736 314 930 354 C1088 386 1170 488 1280 430 L1280 640 L0 640 Z" fill="#111827" opacity="0.72"/>
  <path d="M80 454 L212 386 L316 420 L432 316 L552 352 L676 228 L812 284 L946 176 L1112 218" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#softShadow)">
    <rect x="76" y="78" width="1128" height="430" rx="28" fill="#f8fafc" opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
  </g>

  <g transform="translate(116 120)">
    <text x="0" y="0" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Pump.fun Market Lab</text>
    <text x="0" y="56" fill="#d7e3ea" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Solana meme 原始市场数据实验室</text>
    <text x="0" y="112" fill="#aab8c2" font-family="Segoe UI, Arial, sans-serif" font-size="24">内盘 pump_fun · 外盘 pump_amm · 成本优先分析 · AI 辅助研究</text>

    <g transform="translate(0 178)">
      <rect x="0" y="0" width="232" height="82" rx="18" fill="#0f172a" stroke="#23d18b" stroke-opacity="0.58"/>
      <text x="24" y="34" fill="#23d18b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">RAW ROWS</text>
      <text x="24" y="66" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">20M+</text>
    </g>

    <g transform="translate(260 178)">
      <rect x="0" y="0" width="232" height="82" rx="18" fill="#0f172a" stroke="#4cc9f0" stroke-opacity="0.58"/>
      <text x="24" y="34" fill="#4cc9f0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">COVERAGE</text>
      <text x="24" y="66" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">24h x 2</text>
    </g>

    <g transform="translate(520 178)">
      <rect x="0" y="0" width="292" height="82" rx="18" fill="#0f172a" stroke="#ffd166" stroke-opacity="0.58"/>
      <text x="24" y="34" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">PUBLIC RELEASE</text>
      <text x="24" y="66" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">2.33 GiB</text>
    </g>
  </g>

  <g transform="translate(858 178)" opacity="0.92">
    <rect x="0" y="0" width="284" height="230" rx="22" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="24" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">研究原则</text>
    <line x1="24" y1="64" x2="260" y2="64" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="24" y="104" fill="#d7e3ea" font-family="Segoe UI, Arial, sans-serif" font-size="20">1. 先看原始数据</text>
    <text x="24" y="144" fill="#d7e3ea" font-family="Segoe UI, Arial, sans-serif" font-size="20">2. 再算真实成本</text>
    <text x="24" y="184" fill="#d7e3ea" font-family="Segoe UI, Arial, sans-serif" font-size="20">3. 少讲神话，多复现</text>
  </g>
</svg>
