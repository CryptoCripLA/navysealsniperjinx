name: Validate imported COPY engine source
on:
  push:
    paths:
      - .github/workflows/validate-copy-donor.yml
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all original COPY JavaScript syntax (no trading)
        shell: bash
        run: |
          set -euo pipefail
          cd "components/mortdeus-upstream/2_copy trading bot(node) using gRPC"
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path '*/node_modules/*' -print0)
          echo "COPY_SOURCE_JS_CHECKED=$count"
          test "$count" -ge 3
